
name: BAVARSKI - Выгрузка исходников

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать исходный проект
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./BAVARSKI-PWA.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Архив BAVARSKI-PWA.zip не найден"
            echo "ZIP-файлы в корне:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p source-export/BAVARSKI-PWA

          unzip -q "$ZIP_FILE" -d source-export/BAVARSKI-PWA

          find source-export -name '.DS_Store' -type f -delete
          find source-export -name '._*' -type f -delete
          find source-export -type d -name '__MACOSX' -prune -exec rm -rf {} +

          if [ -z "$(find source-export -type f -print -quit)" ]; then
            echo "Архив распакован, но внутри нет файлов"
            exit 1
          fi

          echo "Содержимое архива:"
          find source-export -maxdepth 5 -type f -print | head -200

          zip -qr BAVARSKI-Sources.zip source-export/BAVARSKI-PWA

      - name: Сохранить исходники как временный артефакт
        uses: actions/upload-artifact@v4
        with:
          name: BAVARSKI-Sources
          path: BAVARSKI-Sources.zip
          if-no-files-found: error
          retention-days: 7
