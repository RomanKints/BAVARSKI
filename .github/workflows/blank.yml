
name: BAVARSKI - Проверка проекта

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Найти архив
        run: |
          echo "Ищем ZIP-файлы:"
          find . -type f -iname "*.zip"

      - name: Проверить архив
        run: |
          ARCHIVE=$(find . -type f -iname "*.zip" -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "Архив не найден"
            exit 1
          fi
          echo "Найден архив: $ARCHIVE"
          unzip -t "$ARCHIVE"

      - name: Распаковать проект
        run: |
          ARCHIVE=$(find . -type f -iname "*.zip" -print -quit)
          mkdir project
          unzip -q "$ARCHIVE" -d project
          echo "Проект распакован успешно"

      - name: Показать файлы проекта
        run: |
          find project -maxdepth 6 -type f
