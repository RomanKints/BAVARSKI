
name: BAVARSKI - Проверка проекта

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Проверить архив
        run: |
          echo "Содержимое архива:"
          unzip -l Склад.zip

      - name: Распаковать проект
        run: |
          mkdir project
          unzip -q Склад.zip -d project

      - name: Показать структуру
        run: |
          find project -maxdepth 5 -type f
