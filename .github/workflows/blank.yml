
name: BAVARSKI - Проверка проекта

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Проверить наличие архива
        run: |
          echo "Проверяем архив Склад.zip"
          ls -lh
          test -f "Склад.zip"

      - name: Проверить содержимое архива
        run: |
          echo "Содержимое архива:"
          unzip -l "Склад.zip"

      - name: Распаковать проект
        run: |
          mkdir project
          unzip -q "Склад.zip" -d project

      - name: Показать структуру проекта
        run: |
          echo "Файлы проекта:"
          find project -maxdepth 5 -type f
