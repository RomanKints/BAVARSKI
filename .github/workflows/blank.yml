
name: BAVARSKI - Проверка проекта

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы
        uses: actions/checkout@v4

      - name: Найти архив
        run: |
          echo "Текущая папка:"
          pwd
          echo "Файлы в репозитории:"
          ls -lah
          echo "Поиск ZIP-архивов:"
          find . -type f -iname "*.zip"

      - name: Проверить наличие архива
        run: |
          ARCHIVE=$(find . -type f -iname "Склад.zip" -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "ОШИБКА: Архив Склад.zip не найден"
            exit 1
          fi
          echo "Архив найден: $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Проверить содержимое архива
        run: |
          ARCHIVE=$(find . -type f -iname "Склад.zip" -print -quit)
          echo "Содержимое архива:"
          unzip -l "$ARCHIVE"

      - name: Распаковать проект
        run: |
          ARCHIVE=$(find . -type f -iname "Склад.zip" -print -quit)
          mkdir project
          unzip -q "$ARCHIVE" -d project
          echo "Архив успешно распакован"

      - name: Показать структуру проекта
        run: |
          echo "Файлы проекта:"
          find project -maxdepth 6 -type f
