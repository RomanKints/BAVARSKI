
name: BAVARSKI - Сборка iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти архив проекта
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Архив проекта не найден"
            exit 1
          fi

          echo "Найден архив: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Найти Package.swift
        run: |
          MANIFEST=$(find project -type f -name Package.swift ! -path '*/__MACOSX/*' ! -name '._*' -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "Package.swift не найден"
            exit 1
          fi

          echo "Найден проект:"
          dirname "$MANIFEST"

      - name: Проверить Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Проверить структуру проекта
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f -name Package.swift ! -path '*/__MACOSX/*' ! -name '._*' -print -quit)")
          echo "Файлы проекта:"
          find "$PROJECT_DIR" -maxdepth 2 -type f
