
name: BAVARSKI - Сборка приложения iPhone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти и распаковать проект
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Архив не найден"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          MANIFEST=$(find project -type f -name Package.swift ! -path '*/__MACOSX/*' ! -name '._*' -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "Package.swift не найден"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MANIFEST")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Проверить исходники
        run: |
          cd "$PROJECT_DIR"

          for FILE in \
            "MyApp.swift" \
            "contentView.swift" \
            "ImportView.swift" \
            "CreateOrderView.swift" \
            "IncomingView.swift" \
            "CatalogView .swift" \
            "Assets.xcassets"
          do
            if [ ! -e "$FILE" ]; then
              echo "Не найден файл: $FILE"
              exit 1
            fi
          done

          echo "Все необходимые файлы найдены"

      - name: Установить XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Создать проект Xcode
        run: |
          cd "$PROJECT_DIR"

          cat > project.yml <<'EOF'
          name: BAVARSKI

          options:
            deploymentTarget:
              iOS: "26.0"

          targets:
            BAVARSKI:
              type: application
              platform: iOS

              sources:
                - path: MyApp.swift
                - path: contentView.swift
                - path: ImportView.swift
                - path: CreateOrderView.swift
                - path: IncomingView.swift
                - path: CatalogView .swift

              resources:
                - path: Assets.xcassets

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.bavarski.warehouse
                  PRODUCT_NAME: BAVARSKI
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
          EOF

          xcodegen generate

      - name: Собрать приложение для iPhone Simulator
        run: |
          cd "$PROJECT_DIR"

          xcodebuild \
            -project BAVARSKI.xcodeproj \
            -scheme BAVARSKI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BAVARSKI-Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Сохранить собранное приложение
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BAVARSKI-iPhone-App
          path: ${{ runner.temp }}/BAVARSKI-Build/Build/Products/Debug-iphonesimulator/BAVARSKI.app
          if-no-files-found: error
