
name: BAVARSKI - Проверка исходников

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти и распаковать проект
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP-архив не найден"
            exit 1
          fi

          echo "Найден архив: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Найти проект и показать Package.swift
        run: |
          MANIFEST=$(find project -type f -name Package.swift ! -path '*/__MACOSX/*' ! -name '._*' -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "Package.swift не найден"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$MANIFEST")

          echo "НАЙДЕН ПРОЕКТ: $PROJECT_DIR"
          echo "========== PACKAGE.SWIFT =========="
          cat "$MANIFEST"

      - name: Найти все Swift-файлы
        run: |
          MANIFEST=$(find project -type f -name Package.swift ! -path '*/__MACOSX/*' ! -name '._*' -print -quit)
          PROJECT_DIR=$(dirname "$MANIFEST")

          echo "========== ВСЕ SWIFT-ФАЙЛЫ =========="
          find "$PROJECT_DIR" -type f -iname '*.swift' ! -name '._*' -print

          echo "========== СОДЕРЖИМОЕ ПАПКИ ПРОЕКТА =========="
          find "$PROJECT_DIR" -maxdepth 3 -type f -print

          echo "========== ГЛАВНЫЙ ЭКРАН =========="
          find "$PROJECT_DIR" -type f -iname '*content*view*.swift' ! -name '._*' -exec sh -c '
            echo "ФАЙЛ: $1"
            cat "$1"
          ' _ {} \;
